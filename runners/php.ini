; Hardened PHP settings for sandbox execution
memory_limit = 128M
max_execution_time = 10
max_input_time = 10
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = Off
allow_url_fopen = Off
allow_url_include = Off
file_uploads = Off
post_max_size = 1M
upload_max_filesize = 1M
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source,pcntl_exec,pcntl_fork,pcntl_alarm,pcntl_waitpid,pcntl_wait,pcntl_wifexited,pcntl_wifstopped,pcntl_wifsignaled,pcntl_wifcontinued,pcntl_wexitstatus,pcntl_wtermsig,pcntl_wstopsig,pcntl_signal,pcntl_signal_dispatch,pcntl_get_last_error,pcntl_strerror,pcntl_sigprocmask,pcntl_sigwaitinfo,pcntl_sigtimedwait,pcntl_getpriority,pcntl_setpriority,dl,putenv,getenv
open_basedir = /workspace:/tmp
