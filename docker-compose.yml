# PHBOX_DATA must be an absolute host path so spawned runner containers
# can mount the same files via the host Docker daemon.
services:
  phbox:
    build: .
    container_name: phbox
    # Default bridge has working outbound HTTPS on some Docker hosts
    # where user-defined compose networks do not.
    network_mode: bridge
    ports:
      - "${PHBOX_PORT:-8080}:8080"
    user: "0:0"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      HOST_DATA_DIR: ${PHBOX_DATA:-/var/lib/phbox/data}
      STATIC_DIR: /app/web/dist
      PHP_INI_PATH: /app/runners/php.ini
      HOST_PHP_INI_PATH: ${PHBOX_INI:-/var/lib/phbox/php.ini}
      RUN_TIMEOUT_MS: "15000"
      COMPOSER_TIMEOUT_MS: "120000"
      RUNNER_MEMORY: "256m"
      COMPOSER_MEMORY: "512m"
      RUNNER_CPUS: "0.5"
      PHP_IMAGE_81: php:8.1-cli
      PHP_IMAGE_82: php:8.2-cli
      PHP_IMAGE_83: php:8.3-cli
      PHP_IMAGE_84: php:8.4-cli
      COMPOSER_IMAGE: composer:2
    volumes:
      - ${PHBOX_DATA:-/var/lib/phbox/data}:/data
      - ${PHBOX_INI:-/var/lib/phbox/php.ini}:/app/runners/php.ini:ro
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  image-warmup:
    image: docker:27-cli
    network_mode: bridge
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        docker pull php:8.1-cli
        docker pull php:8.2-cli
        docker pull php:8.3-cli
        docker pull php:8.4-cli
        docker pull composer:2
    restart: "no"
    profiles: ["warmup"]
